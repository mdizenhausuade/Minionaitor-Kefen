/* ============================================================
   MEZCLAR
============================================================ */

function mezclar(array) {

    const copia = [...array];

    for (
        let i = copia.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            copia[i],
            copia[j]
        ] = [
            copia[j],
            copia[i]
        ];

    }

    return copia;

}

/* ============================================================
   ACTUALIZAR GÉNERO
============================================================ */

function actualizarGenero(pregunta, respuesta) {

    if (
        pregunta.tipo !== "genero"
    ) {

        return;

    }


    if (
        pregunta.texto === "¿Es hombre?"
    ) {

        if (
            respuesta === true
        ) {

            generoConfirmado = "varon";

        }

        else if (
            respuesta === false
        ) {

            generoConfirmado = "mujer";

        }

    }


    if (
        pregunta.texto === "¿Es mujer?"
    ) {

        if (
            respuesta === true
        ) {

            generoConfirmado = "mujer";

        }

        else if (
            respuesta === false
        ) {

            generoConfirmado = "varon";

        }

    }


    if (
        generoConfirmado === "mujer"
    ) {

        preguntasDisponibles =
            preguntasDisponibles.filter(
                p =>
                    p.genero !== "varon"
            );


        const individualesMujer =
            preguntasIndividuales.filter(
                p =>
                    p.genero === "mujer" &&
                    !historial.includes(p.texto)
            );


        preguntasDisponibles.push(
            ...individualesMujer
        );

    }


    if (
        generoConfirmado === "varon"
    ) {

        preguntasDisponibles =
            preguntasDisponibles.filter(
                p =>
                    p.genero !== "mujer"
            );


        const individualesVaron =
            preguntasIndividuales.filter(
                p =>
                    p.genero === "varon" &&
                    !historial.includes(p.texto)
            );


        preguntasDisponibles.push(
            ...individualesVaron
        );

    }

}


/* ============================================================
   UTILIDAD DE PREGUNTA
============================================================ */

function utilidadPregunta(pregunta) {

    const posibles =
        candidatos.filter(
            c =>
                c.puntos > -50
        );


    if (
        posibles.length <= 1
    ) {

        return -999;

    }


    let si = 0;

    let no = 0;


    posibles.forEach(candidato => {

        if (
            pregunta.si.includes(
                candidato.nombre
            )
        ) {

            si++;

        }

        else {

            no++;

        }

    });


    if (
        si === 0 ||
        no === 0
    ) {

        return -999;

    }


    return (
        Math.min(si, no) /
        posibles.length
    );

}

                    p.genero !== "mujer"
            );

    }


    disponibles.sort(
        (a, b) =>
            utilidadPregunta(b) -
            utilidadPregunta(a)
    );


    if (
        disponibles.length === 0
    ) {

        return null;

    }


    const mejor =
        utilidadPregunta(
            disponibles[0]
        );


    const mejores =
        disponibles.filter(
            p =>
                utilidadPregunta(p)
                >= mejor - 0.12
        );


    const elegida =
        mejores[
            Math.floor(
                Math.random() *
                mejores.length
            )
        ];


    preguntasDisponibles =
        preguntasDisponibles.filter(
            p =>
                p.texto !==
                elegida.texto
        );


    return elegida;

}


/* ============================================================
   ACTUALIZAR CANDIDATOS
============================================================ */

function actualizarCandidatos(respuesta) {

    const personasQueRespondenSi =
        preguntaActual.si;


    candidatos.forEach(candidato => {

        const pertenece =
            personasQueRespondenSi.includes(
                candidato.nombre
            );


        if (
            respuesta === true
        ) {

            if (
                pertenece
            ) {

                candidato.puntos += 3;

            }

            else {

                candidato.puntos -= 100;

            }

        }


        if (
            respuesta === false
        ) {

            if (
                pertenece
            ) {

                candidato.puntos -= 100;

            }

            else {

                candidato.puntos += 3;

            }

        }

    });

}


/* ============================================================
   OBTENER POSIBLES
============================================================ */

function obtenerPosibles() {

    return candidatos
        .filter(
            candidato =>
                candidato.puntos > -50
        )
        .sort(
            (a, b) =>
                b.puntos -
                a.puntos
        );

}


/* ============================================================
   ¿PUEDE ADIVINAR?
============================================================ */

function puedeAdivinar() {

    if (
        numeroPregunta <
        MINIMO_PREGUNTAS
    ) {

        return false;

    }


    const posibles =
        obtenerPosibles();


    if (
        posibles.length === 1
    ) {

        return true;

    }


    if (
        posibles.length >= 2
    ) {

        const diferencia =
            posibles[0].puntos -
            posibles[1].puntos;


        if (
            diferencia < 3
        ) {

            return false;

        }


        const utilidades =
            preguntasDisponibles

                .filter(
                    p =>
                        !historial.includes(
                            p.texto
                        )
                )

                .filter(
                    p => {

                        if (
                            generoConfirmado ===
                            "mujer"
                        ) {

                            return (
                                p.genero !==
                                "varon"
                            );

                        }


                        if (
                            generoConfirmado ===
                            "varon"
                        ) {

                            return (
                                p.genero !==
                                "mujer"
                            );

                        }


                        return true;

                    }
                )

                .map(
                    p =>
                        utilidadPregunta(p)
                );


        const mejor =
            Math.max(
                ...utilidades,
                0
            );


        if (
            mejor >= 0.25
        ) {

            return false;

        }


        return true;

    }


    return false;

}


/* ============================================================
   SIGUIENTE PREGUNTA
============================================================ */

function siguientePregunta() {

    if (
        numeroPregunta >=
        MAXIMO_PREGUNTAS
    ) {

        mostrarResultado();

        return;

    }


    if (
        puedeAdivinar()
    ) {

        mostrarResultado();

        return;

    }


    preguntaActual =
        elegirPregunta();


    if (
        !preguntaActual
    ) {

        mostrarResultado();

        return;

    }


    numeroPregunta++;


    historial.push(
        preguntaActual.texto
    );


    const elemento =
        document.getElementById(
            "pregunta"
        );


    elemento.classList.remove(
        "aparecer"
    );


    void elemento.offsetWidth;


    elemento.classList.add(
        "aparecer"
    );


    elemento.textContent =
        preguntaActual.texto;


    const porcentaje =
        Math.min(
            (
                numeroPregunta /
                MAXIMO_PREGUNTAS
            ) * 100,
            95
        );


    document
        .getElementById("progreso")
        .style.width =
        porcentaje + "%";


    document
        .getElementById("mensaje")
        .textContent =
        mensajes[
            Math.min(
                numeroPregunta - 1,
                mensajes.length - 1
            )
        ];

}


/* ============================================================
   RESPONDER
============================================================ */

function responder(respuesta) {

    if (
        respuesta === null
    ) {

        document
            .getElementById("mensaje")
            .textContent =
            "Bueno... voy a buscar otra pista 👀";


        setTimeout(
            siguientePregunta,
            400
        );


        return;

    }


    actualizarGenero(
        preguntaActual,
        respuesta
    );


    actualizarCandidatos(
        respuesta
    );


    setTimeout(
        siguientePregunta,
        400
    );

}


/* ============================================================
   MOSTRAR RESULTADO
============================================================ */

function mostrarResultado() {

    const posibles =
        obtenerPosibles();


    let ganador;


    if (
        posibles.length > 0
    ) {

        ganador =
            posibles[0];

    }

    else {

        ganador =
            candidatos.sort(
                (a, b) =>
                    b.puntos -
                    a.puntos
            )[0];

    }


    if (!ganador) {

        return;

    }


    document
        .getElementById("juego")
        .classList.add("oculto");


    document
        .getElementById("resultado")
        .classList.remove("oculto");


    document
        .getElementById("progreso")
        .style.width =
        "100%";


    document
        .getElementById(
            "nombreResultado"
        )
        .textContent =
        ganador.nombre.toUpperCase();


    const foto =
        document.getElementById(
            "fotoResultado"
        );


    if (
        fotos[ganador.nombre]
    ) {

        foto.src =
            fotos[ganador.nombre];

        foto.alt =
            ganador.nombre;

        foto.style.display =
            "block";

    }

    else {

        foto.style.display =
            "none";

    }


    document
        .getElementById(
            "textoResultado"
        )
        .textContent =
        "¡TE DESCUBRÍ! 🟡";

}


/* ============================================================
   REINICIAR
============================================================ */

function reiniciar() {

    document
        .getElementById("resultado")
        .classList.add("oculto");


    document
        .getElementById("juego")
        .classList.add("oculto");


    document
        .getElementById("inicio")
        .classList.remove("oculto");


    candidatos = [];

    preguntasDisponibles = [];

    preguntaActual = null;

    numeroPregunta = 0;

    historial = [];

    generoConfirmado = null;

}

</script>
